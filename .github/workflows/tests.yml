name: Unit Tests

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!master'

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests (.NET 9.0, log4net ${{ matrix.log4net }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        log4net: ['2.0.17', '3.3.0']
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0'

      - name: Display dotnet version
        run: dotnet --version

      - name: Install dependencies
        working-directory: ./src
        run: dotnet restore logzio-dotnet.sln -p:Log4netVersion=${{ matrix.log4net }}

      - name: Build package
        working-directory: ./src
        run: dotnet build logzio-dotnet.sln --configuration Release --no-restore -p:Log4netVersion=${{ matrix.log4net }}

      - name: Run Unit Tests
        working-directory: ./src
        run: |
          dotnet test ./UnitTests/UnitTests.csproj \
            --configuration Release \
            --no-build \
            --framework net9.0 \
            -p:Log4netVersion=${{ matrix.log4net }} \
            --logger "console;verbosity=normal"
